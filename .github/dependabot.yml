version: 2
updates:
  # npm dependencies. Grouped so related upgrades land in one reviewable PR
  # rather than dozens. Majors are grouped separately because they can carry
  # breaking changes (e.g. wrangler 3→4, the vitest 4.0→4.1 harness change,
  # a Next 16 migration) that need their own verification.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # G943: hold `next` below 16.4. Next 16.4 reads
    # .next/server/preview-props.json at server start, and
    # @opennextjs/cloudflare (1.20.10, latest as of 2026-10-11) doesn't inline
    # it. Every request on Workers then throws CF error 1101. That is how #287
    # failed the preview gate before it was reverted in #291 and re-landed
    # pinned to ~16.3.8 in #292. A 16.4 bump still passes CI and only fails the
    # deploy's fail-closed preview gate, so the bump would leave main
    # undeployable.
    # Lift this ignore only when an @opennextjs/cloudflare release supports
    # 16.4. Prove that first: `wrangler pages dev` on the OpenNext bundle must
    # return 200 on /api/health and /.
    #
    # Hold `typescript` below 7.0 (xpelevator#16 Phase 5; PR #333 excluded it,
    # PR #336 proved why). typescript-eslint — bundled by eslint-config-next 16
    # — does not support TS 7.0: it hard-errors "typescript-eslint does not
    # support TS 7.0" at config load, so `npm run lint` dies with exit code 2
    # before linting a single file. PR #336 (typescript 5.9.3→7.0.2) confirmed
    # this in CI: the Quality (typecheck + lint) job failed while every other
    # gate (build/unit/ui/coverage/migration/smoke/audit) passed. Merging a TS7
    # bump would leave main's lint permanently broken.
    # Lift this ignore only when typescript-eslint ships TS >=7.1 support
    # (typescript-eslint/typescript-eslint#10940). Prove it first: bump TS and
    # confirm `npm run lint` exits 0 locally before re-arming.
    ignore:
      - dependency-name: next
        versions: [">=16.4.0"]
      - dependency-name: typescript
        versions: [">=7.0.0"]
    groups:
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      dev-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
      majors:
        update-types:
          - major

  # Keep the GitHub Actions used by CI/deploy patched too.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
