name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast static gates — no build, no DB. Every PR must pass typecheck + lint.
  quality:
    name: Quality (typecheck + lint)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Lint (eslint, zero errors)
        run: npm run lint

  # Dependency-security gate (PLATFORM_STANDARDS §5). The BLOCKING check audits
  # the production tree only (--omit=dev) so dev-dep noise can't block unrelated
  # PRs; the full-tree audit runs as a separate advisory step (reports, never
  # fails) until the remaining dev-tree advisories are clearable (tracked via
  # the open Dependabot majors). Standing Law 1: this gate shipped red-first —
  # see the proof-of-rejection run linked in the PR that introduced it.
  audit:
    name: Dependency audit (prod tree, high+)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # npm audit needs only the lockfile — no install required.
      - name: Audit production dependencies (BLOCKING, high+)
        run: npm audit --omit=dev --audit-level=high

      - name: Audit full tree (advisory — reports, never fails)
        continue-on-error: true
        run: npm audit --audit-level=high

  # Deterministic unit tests — no DB, no live LLM/Telnyx creds (all mocked).
  # Job name kept stable as a required status check.
  unit-tests:
    name: Unit tests (vitest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (vitest run tests/unit)
        run: npm run test:unit

  # Deterministic ui tier — React component render in happy-dom. All deps mocked
  # (auth/next-auth/next-navigation/fetch), no DB/LLM/Telnyx creds, can't flake.
  ui-tests:
    name: UI tests (vitest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: UI component tests (vitest run tests/ui)
        run: npm run test:ui

  # Coverage gate on the DETERMINISTIC tiers (unit + ui), scoped to the pure
  # business-logic surface (src/lib/**, minus runtime-only DB/binding glue) plus
  # the API routes that now have deterministic tests (issue #16, P2-7 — first:
  # src/app/api/analytics/route.ts; routes join the include allowlist as they
  # gain a tests/unit/api/** test). Enforces the PLATFORM_STANDARDS §3-4 floor
  # (line & function already met; branches ratchet toward 85). Config:
  # vitest.ci.config.ts. Kept separate from the credential-bound `test:e2e`
  # script, which hits live Neon+Groq and can't be a required gate.
  coverage:
    name: Coverage gate (src/lib)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Coverage gate (vitest run --config vitest.ci.config.ts --coverage)
        run: npm run test:coverage:ci

  build:
    name: Build
    runs-on: ubuntu-latest

    env:
      # Dummy values — build does not connect to DB at build time.
      # Real secrets must be set in Cloudflare Pages environment variables.
      DATABASE_URL: postgresql://user:pass@localhost/db
      GROQ_API_KEY: dummy-key-for-build
      AUTH_SECRET: dummy-secret-for-build

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # Playwright smoke tier (PLATFORM_STANDARDS §3-4 "Playwright `smoke` tier
  # mandatory"; issue #156). A real Chromium drives a production `next start` of
  # this build over the DB-free public surface (`/`, `/pricing`, `/auth/signin`)
  # — the pages the next.config.ts CSP note already proved render + hydrate clean
  # headless. DETERMINISTIC and credential-free (dummy DB/LLM env, same posture
  # as `build`), so it can be a required gate without the live-Neon/Groq flake
  # that keeps the integration tier out. Covers what the deploy-time curl gates
  # cannot: real DOM render + hydration, the "never the word 'AI' in user-facing
  # copy" rule enforced on rendered browser text, response security headers, and
  # keyboard-focus a11y. Standing Law 1 proof-of-rejection: the copy-clean +
  # marker assertions are verified to FAIL red against a deliberately-wrong
  # expectation (captured in the PR that introduced this gate).
  smoke:
    name: Playwright smoke (public surface)
    runs-on: ubuntu-latest

    env:
      # Dummy, non-secret values — the smoke surface never touches DB/LLM.
      DATABASE_URL: postgresql://user:pass@localhost/db
      GROQ_API_KEY: dummy-key-for-smoke
      AUTH_SECRET: dummy-secret-for-smoke-0123456789abcdef
      AUTH_TRUST_HOST: "true"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build (production)
        run: npm run build

      # playwright.config.ts owns the `next start` lifecycle (webServer).
      - name: Smoke tests (playwright)
        run: npm run test:smoke

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Migration-integrity gate (issue #16 Phase 3 / #156 "no staging: migrate
  # deploy hits the live prod Neon DB directly"). Every PR replays the FULL
  # migration history against a throwaway Postgres service container — no
  # secrets, nothing touches Neon — proving:
  #   1. (HARD) the history applies cleanly from an EMPTY database, so the DB is
  #      reconstructable from migrations and any NEW migration (e.g. the pending
  #      RLS work, #157) is known to apply from scratch BEFORE deploy.yml's
  #      `migrate deploy` ever runs it against production;
  #   2. (HARD, Standing Law 1 proof-of-rejection) a deliberately broken
  #      migration is REJECTED — the gate is provably not a no-op;
  #   3. (HARD, Standing Law 5 ratchet PROMOTED — issue #215) schema<->migration
  #      drift is ZERO. The organizations/users retrofit-baseline drift was
  #      reconciled (schema.prisma now declares the DB-level gen_random_uuid() id
  #      defaults, timestamptz created_at, and the parent_org_id onDelete FK), so
  #      the migration history is once again the single source of truth and any
  #      drift — including an RLS migration that doesn't diff clean — fails CI.
  migrations:
    name: Migration integrity (ephemeral Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: prisma
          POSTGRES_PASSWORD: prisma
          POSTGRES_DB: xpelevator_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prisma"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://prisma:prisma@localhost:5432/xpelevator_ci

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # HARD GATE 1 — the whole migration history must apply cleanly from empty.
      - name: Replay all migrations from an empty DB (prisma migrate deploy)
        run: npx prisma migrate deploy

      # HARD GATE 2 — proof-of-rejection (Standing Law 1): a broken migration
      # MUST fail `migrate deploy`. Runs against a SEPARATE scratch database and
      # a throwaway copy of the migrations tree, so it never perturbs the tree
      # gate 1 validated. Fails the job if a broken migration is accepted.
      - name: Proof-of-rejection — a broken migration must be rejected
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c "DROP DATABASE IF EXISTS negctl;" -c "CREATE DATABASE negctl;"
          tmp="$(mktemp -d)"
          cp -r prisma "$tmp/prisma"
          printf 'provider = "postgresql"\n' > "$tmp/prisma/migrations/migration_lock.toml"
          bad="$tmp/prisma/migrations/29990101000000_negctl_broken"
          mkdir -p "$bad"
          echo 'ALTER TABLE "table_that_does_not_exist" ADD COLUMN "x" TEXT;' > "$bad/migration.sql"
          set +e
          DATABASE_URL="postgresql://prisma:prisma@localhost:5432/negctl" \
            npx prisma migrate deploy --schema "$tmp/prisma/schema.prisma"
          code=$?
          set -e
          if [ "$code" = "0" ]; then
            echo "::error::migrate deploy ACCEPTED a broken migration — the gate is a no-op"
            exit 1
          fi
          echo "proof-of-rejection OK — broken migration rejected (exit $code)"

      # HARD GATE 3 — schema<->migration drift must be ZERO (Standing Law 5
      # ratchet promoted — issue #215). The organizations/users retrofit-baseline
      # drift was reconciled (schema.prisma now declares the DB-level
      # gen_random_uuid() id defaults, timestamptz created_at, and the
      # parent_org_id onDelete: Restrict FK), so `migrate diff` returns empty.
      # From here the migration history is the single source of truth: any PR
      # that lets schema.prisma drift from the migrations — including a future
      # RLS migration that doesn't diff clean — fails this job.
      - name: Schema↔migration drift must be empty [#215]
        run: |
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code

  # NOTE: the DETERMINISTIC tiers — unit (tests/unit, 73 tests) and ui
  # (tests/ui, 21 tests, React render in happy-dom) — are wired as required
  # gates above. All deps are mocked (auth/next-auth/next-navigation/fetch), so
  # neither needs DB/LLM/Telnyx creds and neither can flake on credentials.
  # The deterministic §3-4 stack is now complete: the coverage gate + the
  # Playwright `smoke` tier (both required above). The credential-bound live
  # suites have been pared down to the one out-of-band `test:e2e` script
  # (tests/e2e/full-simulation.ts, hits live Neon + Groq via tests/setup.ts's
  # real .env) — deliberately NOT a required gate, since a credential-dependent
  # suite would flake/block every PR. Live smoke against prod is covered by the
  # `uptime-monitor` health + scoring canary. (issue #156.)

  # ---------------------------------------------------------------------------
  # Required-status aggregator. The main-protection ruleset requires a single
  # status context named "ci", but no job in this workflow carried that name —
  # so the required check never reported, auto-merge could never fire, and
  # every merge went through admin bypass (found 2026-07-26; the G70 survey
  # crediting this repo with a working `ci` gate was wrong). This job IS that
  # context: it reports on every PR and fails unless every gate above succeeded.
  ci:
    name: ci
    if: always()
    needs: [quality, unit-tests, ui-tests, coverage, build, audit, migrations, smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate to have succeeded
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "gate results: $results"
          for r in $results; do
            if [ "$r" != "success" ]; then
              echo "::error::a required gate finished '$r' — the ci context refuses this merge"
              exit 1
            fi
          done
          echo "all gates green"
