name: Uptime + scoring monitor

# Phase 1 tail — "Uptime checks on /api/health + a scoring canary".
#
# Runs on the Actions runner (the sandbox/prod egress to the branded domain is
# policy-blocked; all live checks run runner-side per the repo's staged-secrets
# pattern). Two jobs, split by cron so the cheap check runs often and the heavy
# end-to-end check runs a few times a day:
#
#   health  (every 15 min) — /api/health 200 on xpelevator.com + the pages.dev
#     alias, a PUBLIC DB-read canary (GET /api/branding/<nonexistent-slug> -> 404
#     on both hosts), a PHONE-webhook reachability canary (POST an unsigned body
#     to /api/telnyx/webhook -> 401 on both hosts), AND a direct Groq /v1/models
#     credential probe. Silent failure modes health alone can't see:
#       - expired GROQ_API_KEY nulls every score while /api/health stays 200 (it
#         only checks the var is present, not that it authenticates) — the Groq
#         probe catches it (live-issue #1);
#       - a DB driver/connection regression 500s every DB read while /api/health
#         stays 200 (health touches no DB) — the branding canary catches it. On
#         2026-07-14 #78 shipped exactly that and this monitor stayed green, so
#         the outage was silent until the 6-hourly scoring canary. The canary
#         closes that gap: a 500 (not 404) opens an alert issue within 15 min;
#       - the phone modality is invisible to the chat-only scoring canary. On
#         2026-07-19 #125 the Telnyx signature verifier read its signing key from
#         process.env (undefined in the deployed Worker) and fail-closed EVERY
#         webhook — phone went dark, unmonitored. The webhook canary asserts the
#         route is reachable + fail-CLOSED (401 to an unsigned probe): 404 (route
#         dropped), 500 (import crash), or 200 (fail-OPEN — unsigned webhook
#         accepted) each open an alert. A valid signature needs Telnyx's private
#         key we don't hold, so the exact #125 always-401 key bug stays covered by
#         the auth-api unit tests, not this black-box probe.
#
#   scoring-canary (every 6h) — drives one full authenticated session against the
#     live branded domain and asserts a NON-NULL score, then prunes old canary
#     sessions so the live DB doesn't accrete monitor rows. It MINTS its own
#     Auth.js v5 session cookie, so its AUTH_SECRET must match the value the live
#     worker verifies with. Production's AUTH_SECRET was cut over to GCP SM
#     (XPELEVATOR_AUTH_SECRET) and rotated by PR #252; this job now sources the
#     same secret from GCP SM (validated SM-first, GitHub-secret fallback) so the
#     mint and the verify agree — see the job for the 2026-08-17 regression (#248).
#
# Any failure opens (or comments on) a single GitHub alert issue, so a red run in
# the Actions tab becomes an actual notification. Touches NO DNS.
on:
  schedule:
    - cron: '*/15 * * * *'   # health + credential probe
    - cron: '17 */6 * * *'   # end-to-end scoring canary
  workflow_dispatch:
  push:
    # Self-verify once on merge (dispatch needs actions:write the MCP token lacks).
    branches: [main]
    paths:
      - '.github/workflows/uptime-monitor.yml'
      - 'scripts/uptime-check.mjs'
      - 'scripts/phase1-canary.mjs'
      - 'scripts/prune-canary-sessions.mjs'
      - 'scripts/monitor-alert.cjs'

concurrency:
  group: uptime-monitor-${{ github.event.schedule || github.event_name }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  id-token: write   # WIF/OIDC → GCP Secret Manager for the canary's AUTH_SECRET

jobs:
  health:
    name: Health + scoring-credential probe
    # On schedule run only for the 15-min cron; on push/dispatch always run.
    if: ${{ github.event_name != 'schedule' || github.event.schedule == '*/15 * * * *' }}
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      # No npm install: the probe uses only Node's global fetch.
      - name: Probe /api/health + Groq credential
        run: node scripts/uptime-check.mjs
      - name: Alert on failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const reason = fs.existsSync('monitor-failure.md')
              ? fs.readFileSync('monitor-failure.md', 'utf8')
              : 'Health / scoring-credential probe failed (no detail file written).';
            await require('./scripts/monitor-alert.cjs')({ github, context, reason, job: 'health' });

  scoring-canary:
    name: End-to-end scoring canary (non-null score)
    if: ${{ github.event_name != 'schedule' || github.event.schedule == '17 */6 * * *' }}
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://xpelevator.com
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # No-lockout default. The canary MINTS an Auth.js v5 session cookie with this
      # secret (scripts/phase1-canary.mjs step 2) and presents it to the live
      # worker, which decodes it with ITS runtime AUTH_SECRET. Production's
      # AUTH_SECRET was cut over to GCP SM (XPELEVATOR_AUTH_SECRET, a fresh 64-hex)
      # and rotated by PR #252, so this stale GitHub-secret value no longer matches
      # — the minted cookie failed to decode and the canary went red on the auth
      # step for ~2 days (alert #248, 2026-08-17 → 2026-08-19, "server user.email
      # mismatch" / GET /api/auth/session -> null). The "Resolve AUTH_SECRET from
      # GCP SM" step below sources the SAME value production verifies with (Standing
      # Law 3 — one source of truth), so the mint and the verify agree again. An
      # absent/short SM copy or unavailable WIF leaves this value in place
      # (no-lockout fallback).
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Detect OIDC availability
        id: oidc
        # ACTIONS_ID_TOKEN_REQUEST_URL is present only when id-token:write is
        # granted. Gate the GCP auth path on it so the job falls back to the
        # GitHub-secret AUTH_SECRET when OIDC is unavailable (no-lockout).
        run: |
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Authenticate to GCP (WIF)
        if: steps.oidc.outputs.available == 'true'
        # continue-on-error: no-lockout. A misconfigured WIF trust must never break
        # the canary — it falls back to the GitHub-secret AUTH_SECRET.
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          service_account: factory-sa@factory-495015.iam.gserviceaccount.com
          workload_identity_provider: projects/891842778224/locations/global/workloadIdentityPools/github-factory/providers/github
      - name: Set up gcloud
        if: steps.oidc.outputs.available == 'true'
        continue-on-error: true
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Resolve AUTH_SECRET from GCP SM (validated SM-first, GitHub-secret fallback)
        id: sm-auth
        if: steps.oidc.outputs.available == 'true'
        # Mirror the deploy job's AUTH_SECRET cutover (deploy.yml, PR #252): source
        # the canary's minting secret from GCP SM XPELEVATOR_AUTH_SECRET so it
        # matches the value the live worker verifies with. No external service to
        # authenticate against, so validate structurally (non-empty, >=32 chars) and
        # export to $GITHUB_ENV ONLY on PASS (SM wins, overriding the job-level
        # GitHub-secret default for the canary step). An absent/short/failing SM copy
        # or unavailable WIF writes nothing, leaving the GitHub-secret AUTH_SECRET in
        # place (no-lockout). continue-on-error so a fallback path never blocks the
        # canary; the mint/verify round-trip in phase1-canary.mjs stays the real
        # fail-capable gate (a wrong secret → red canary), so this is proof-capable,
        # not a rubber stamp.
        continue-on-error: true
        run: |
          set -uo pipefail
          proj="factory-495015"
          auth_pass=FAIL
          # fetch into a LOCAL var only; strip UTF-8 BOM + CR/LF; mask
          auth="$(gcloud secrets versions access latest --secret=XPELEVATOR_AUTH_SECRET --project="$proj" --quiet 2>/dev/null \
                | sed $'1s/^\xEF\xBB\xBF//' | tr -d '\r\n')" || auth=""
          [ -n "$auth" ] && echo "::add-mask::$auth"
          if [ -z "$auth" ]; then
            echo "⚠️  XPELEVATOR_AUTH_SECRET absent in SM — keeping GitHub-secret AUTH_SECRET"
          elif [ "${#auth}" -lt 32 ]; then
            echo "❌ SM XPELEVATOR_AUTH_SECRET too short (${#auth}<32) — keeping GitHub-secret AUTH_SECRET"
          else
            auth_pass=PASS
            echo "AUTH_SECRET=$auth" >> "$GITHUB_ENV"
            echo "✅ SM XPELEVATOR_AUTH_SECRET valid (${#auth} chars) → (AUTH_SECRET ← GCP SM); matches the deployed worker"
          fi
          src_auth="GitHub secret (fallback)"; [ "$auth_pass" = "PASS" ] && src_auth="GCP SM"
          {
            echo "### scoring-canary AUTH_SECRET source (validated SM-first, GitHub-secret fallback)"
            echo ""
            echo "| secret (GCP SM) | validation | result | source used |"
            echo "|---|---|---|---|"
            echo "| XPELEVATOR_AUTH_SECRET | structural (>=32 chars) | $auth_pass | $src_auth |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "CANARY AUTH_SECRET SOURCE: $auth_pass ($src_auth)"
      - name: Drive a full session and assert a non-null score
        run: node scripts/phase1-canary.mjs
      - name: Prune old canary sessions (keep newest 3)
        if: always()
        run: node scripts/prune-canary-sessions.mjs
      - name: Alert on failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const reason =
              'The end-to-end scoring canary failed against https://xpelevator.com — a full ' +
              'authenticated session did NOT produce a non-null score (the Phase-1 core-loop ' +
              'acceptance) OR the scored session recorded NO per-turn Groq token usage ' +
              '(R-132 / #155 — the Phase-4 wholesale-seat margin input). See the run log for ' +
              'the failing step.';
            await require('./scripts/monitor-alert.cjs')({ github, context, reason, job: 'scoring-canary' });
