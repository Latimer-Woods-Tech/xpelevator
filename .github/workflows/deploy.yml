            exit 1
          fi
          echo "✅ /api/branding/by-host is public and 404s a non-operator host on both hosts"

      - name: Verify self-context /api/me is auth-gated (Phase 4)
        # GET /api/me returns the CALLER'S OWN identity + org context (id, slug,
        # kind, plan, parentOrgId, canManageClients) — the bootstrap primitive
