          OP="11111111-1111-1111-1111-111111111111"
          for BASE in "https://${CF_PROJECT}.pages.dev" "https://xpelevator.com"; do
            # GET (list clients) — anon must be 401
            gcode=000
            for i in 1 2 3 4 5; do
              gcode=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/api/orgs/$OP/clients" || echo 000)
              if [ "$gcode" = "401" ]; then break; fi
