        # `<operator>.xpelevator.com` can show the operator's brand with no slug in
        # the path. Both deploy hosts here — the branded apex `xpelevator.com` and
        # the `*.pages.dev` alias — are PLATFORM hosts, NOT operator subdomains, so
        # `resolveOperatorSlugFromHost` returns null and the route 404s WITHOUT
        # touching the DB. Permanent regression gate: an anonymous GET returns 404
        # (proves the route is PUBLIC — a 401 would mean the middleware prefix
        # regressed — and that a non-operator host yields a clean 404, never a
