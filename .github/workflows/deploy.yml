                echo "::error::$BASE/api/scenario-packs leaked a scenario script (hidden mechanics) to anonymous callers"
                fail=1
              fi
            fi
            # --- /library surface: anon 200 + copy-clean ---
            code=000
            for i in 1 2 3 4 5; do
              code=$(curl -s -o /tmp/library.html -w '%{http_code}' "$BASE/library" || echo 000)
