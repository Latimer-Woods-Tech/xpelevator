      - name: Verify security headers (Phase 2 3/3)
        # Assert the security-header set is present on the freshly-deployed build.
        # Targets a DYNAMIC document route (/) and an API route (/api/health) —
        # both rendered by the OpenNext worker, so next.config headers() attaches.
        # Checked on the pages.dev alias (authoritative for this deploy) AND the
        # branded domain (proves live users are protected). A missing header
        # fails the deploy — this is a permanent regression gate.
        run: |
          set -e
          fail=0
          # Header name (case-insensitive) + a substring its value MUST contain.
          check_header() {
            local hdrs="$1" name="$2" needle="$3" where="$4"
            local line
            line=$(printf '%s' "$hdrs" | grep -i "^$name:" | head -1 || true)
            if [ -z "$line" ]; then
              echo "::error::$where missing header $name"; fail=1; return
            fi
            if ! printf '%s' "$line" | grep -iq "$needle"; then
              echo "::error::$where $name present but missing '$needle' -> $line"; fail=1; return
            fi
            echo "  ✓ $name ($needle)"
          }
          for BASE in "https://${CF_PROJECT}.pages.dev" "https://xpelevator.com"; do
            for path in / /api/health; do
              echo "== $BASE$path =="
              H=""
              for i in 1 2 3 4 5; do
                H=$(curl -sS -D - -o /dev/null "$BASE$path" || echo '')
                if printf '%s' "$H" | grep -iq '^content-security-policy:'; then break; fi
                sleep 6
              done
              check_header "$H" "content-security-policy"   "frame-ancestors 'none'"           "$BASE$path"
              check_header "$H" "strict-transport-security"  "max-age=31536000"                 "$BASE$path"
              check_header "$H" "x-content-type-options"     "nosniff"                          "$BASE$path"
              check_header "$H" "x-frame-options"            "DENY"                             "$BASE$path"
              check_header "$H" "referrer-policy"            "strict-origin-when-cross-origin"  "$BASE$path"
              # microphone=(self) MUST survive — browser voice mode depends on it.
              check_header "$H" "permissions-policy"         "microphone=(self)"                "$BASE$path"
            done
          done
          if [ "$fail" != "0" ]; then
            echo "::error::Phase 2 (3/3) security-header verification failed"
            exit 1
          fi
          echo "✅ Security headers present on both hosts (document + API)"

      - name: Verify x-request-id correlation header (R-111, #154)
        # Observability foundation (#154, Phase 3): the middleware mints /
        # propagates a per-request x-request-id on EVERY response path so a
        # request is traceable end-to-end (client-visible header ↔ structured
        # logs). Permanent regression gate on the freshly-deployed build.
        #
        # On BOTH the pages.dev alias (authoritative for this deploy) AND the
        # branded domain, assert the properties that survive Cloudflare's edge:
        #   1. a public pass-through (/api/health 200) carries a non-empty id;
        #   2. two calls mint DISTINCT ids (per-request, not a static value);
        #   4. the anonymous /api 401 path (/api/scenarios) also carries an id.
        #
        # The "honour a caller-supplied id" property (3) is an ORIGIN-WORKER
        # behaviour and is asserted on the pages.dev alias ONLY. The branded
        # domain sits behind the full CF proxy, which manages/strips inbound
        # custom correlation headers before they reach the worker — so a
        # client-supplied x-request-id cannot be echoed there (verified: the
        # branded domain mints server-side, which is also the safer public
        # posture — a public client must not be able to choose its own trace id).
        # Unit tests (tests/unit/middleware.test.ts) pin the honour-supplied-id
        # logic at the code layer.
        run: |
          set -e
          fail=0
          rid() { printf '%s' "$1" | grep -i '^x-request-id:' | head -1 | tr -d '\r' | awk '{print $2}'; }
          ALIAS="https://${CF_PROJECT}.pages.dev"
          for BASE in "$ALIAS" "https://xpelevator.com"; do
            echo "== $BASE =="
            # (1) public pass-through carries a non-empty id (retry until live).
            id1=""
            for i in 1 2 3 4 5 6 7 8; do
              id1=$(rid "$(curl -sS -D - -o /dev/null "$BASE/api/health" || echo '')")
              [ -n "$id1" ] && break
              sleep 6
            done
            if [ -z "$id1" ]; then
              echo "::error::$BASE/api/health has no x-request-id header"; fail=1; continue
            fi
            echo "  ✓ /api/health x-request-id=$id1"
            # (2) a second call mints a DISTINCT id.
            id2=$(rid "$(curl -sS -D - -o /dev/null "$BASE/api/health" || echo '')")
            if [ -z "$id2" ] || [ "$id1" = "$id2" ]; then
              echo "::error::$BASE minted a non-distinct x-request-id (id1=$id1 id2=$id2)"; fail=1
            else
              echo "  ✓ distinct per request ($id1 != $id2)"
            fi
            # (3) a caller-supplied id is echoed back — ORIGIN-WORKER property,
            # asserted at the worker-direct alias only (the CF edge in front of
            # the branded domain manages inbound correlation headers).
            if [ "$BASE" = "$ALIAS" ]; then
              want="ci-trace-${{ github.run_id }}"
              got=$(rid "$(curl -sS -D - -o /dev/null -H "x-request-id: $want" "$BASE/api/health" || echo '')")
              if [ "$got" != "$want" ]; then
                echo "::error::$BASE did not echo supplied x-request-id (want=$want got=${got:-<none>})"; fail=1
              else
                echo "  ✓ echoes caller-supplied id ($want)"
              fi
            else
              echo "  – echo check skipped (CF edge manages inbound x-request-id; proven at the alias + unit tests)"
            fi
            # (4) the anonymous /api 401 path also carries an id.
            H401=$(curl -sS -D - -o /dev/null "$BASE/api/scenarios" || echo '')
            code=$(printf '%s' "$H401" | grep -iE '^HTTP/' | tail -1 | awk '{print $2}')
            id401=$(rid "$H401")
            if [ "$code" != "401" ] || [ -z "$id401" ]; then
              echo "::error::$BASE/api/scenarios 401 path missing x-request-id (code=${code:-<none>} id=${id401:-<none>})"; fail=1
            else
              echo "  ✓ 401 path carries x-request-id=$id401"
            fi
          done
          if [ "$fail" != "0" ]; then
            echo "::error::R-111 x-request-id correlation verification failed"
            exit 1
          fi
          echo "✅ x-request-id correlation present + distinct on both hosts; caller-id echo proven at the worker-direct alias (#154)"

      - name: Verify public-route rate limiting engages (429) — #157
        # #157: the ANONYMOUS public routes (the brand-render reads + the public
        # catalogs) took unbounded traffic. src/lib/rate-limit.ts now throttles
        # per client-IP against a shared Neon counter (DB-backed on purpose:
        # Workers run many isolates/colos, so in-memory under-counts). This is
        # the permanent live proof-of-rejection: hammer the always-public
        # enumeration point (GET /api/branding/[slug]) from one IP and assert an
        # unknown slug 404s first (route + limiter wired, under budget) and then
        # flips to 429 once the per-IP budget (100/min) is crossed. A unique
        # slug + cache-buster per request guarantees every hit reaches the origin
        # (never a CDN-cached 404). The counter is keyed on IP+window (not host),
        # so the *.pages.dev alias is limited within the same tripped window too.
        run: |
          set -e
          PROBE="__ratelimit_probe_${{ github.run_id }}__"
          BASE="https://xpelevator.com"
          saw404=0; saw429=0; sawretry=0; code=000
          # Capture headers of EVERY request; when one 429s we read Retry-After
          # from that exact response. (A separate follow-up request can land in a
          # new 60s window with the counter reset — that flaked run 31144418179.)
          # Budget is 100/min; a single mid-loop window rollover can cost up to
          # ~100 requests, so allow generous headroom to still cross the cap.
          for i in $(seq 1 260); do
            code=$(curl -s -D /tmp/rl-hdr.txt -o /dev/null -w '%{http_code}' "$BASE/api/branding/$PROBE?_=$i" || echo 000)
            [ "$code" = "404" ] && saw404=1
            if [ "$code" = "429" ]; then
              saw429=1
              echo "→ 429 after $i anonymous requests"
              grep -iE 'HTTP/|^retry-after:|^cache-control:' /tmp/rl-hdr.txt || true
              grep -iq '^retry-after:' /tmp/rl-hdr.txt && sawretry=1
              break
            fi
          done
          echo "branded domain: saw404=$saw404 saw429=$saw429 sawretry=$sawretry last=$code"
          if [ "$saw404" != "1" ]; then
            echo "::error::/api/branding/[slug] never 404'd for an unknown slug (last=$code) — route/limiter wiring is wrong"
            exit 1
          fi
          if [ "$saw429" != "1" ]; then
            echo "::error::rate limiter never engaged after 260 anonymous requests — the public surface is unthrottled (#157)"
            exit 1
          fi
          # Retry-After on the 429 proves it is OUR limiter, not an edge 429.
          if [ "$sawretry" != "1" ]; then
            echo "::error::429 present but missing Retry-After — not the app limiter"
            exit 1
          fi
          # Cross-host: the counter is shared (IP+window), so the alias should be
          # limited in the same window. Informational only (a window-boundary
          # roll between the loop and this probe must not flake the gate).
          alias_code=$(curl -s -o /dev/null -w '%{http_code}' "https://${CF_PROJECT}.pages.dev/api/branding/$PROBE?_=alias" || echo 000)
          echo "pages.dev alias within the tripped window -> $alias_code (informational)"
          echo "✅ #157 public-route rate limiting engaged (429 + Retry-After) on the branded domain"
