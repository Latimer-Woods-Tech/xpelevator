            gcode=000
            for i in 1 2 3 4 5; do
              gcode=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/api/orgs/$OP/branding" || echo 000)
              if [ "$gcode" = "401" ]; then break; fi
              sleep 6
            done
            echo "GET $BASE/api/orgs/$OP/branding (anon) -> HTTP $gcode"
            if [ "$gcode" != "401" ]; then
              echo "::error::$BASE/api/orgs/[id]/branding GET must require auth (got $gcode) — tenant branding exposed"
              fail=1
            fi
