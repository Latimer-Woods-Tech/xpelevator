            done
            echo "GET $BASE/api/orgs/$OP/clients (anon) -> HTTP $gcode"
            if [ "$gcode" != "401" ]; then
              echo "::error::$BASE/api/orgs/[id]/clients GET must require auth (got $gcode) — client-list tenant data exposed"
              fail=1
            fi
            # POST (create client) — anon must be 401
            pcode=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              -H 'Content-Type: application/json' \
              -d '{"name":"gate-probe"}' \
              "$BASE/api/orgs/$OP/clients" || echo 000)
            echo "POST $BASE/api/orgs/$OP/clients (anon) -> HTTP $pcode"
            if [ "$pcode" != "401" ]; then
              echo "::error::$BASE/api/orgs/[id]/clients POST must require auth (got $pcode) — client-create write path exposed"
              fail=1
            fi
          done
          if [ "$fail" != "0" ]; then
            echo "::error::Operator client-management admin-gate verification failed"
            exit 1
          fi
          echo "✅ /api/orgs/[id]/clients rejects anonymous GET + POST (401) on both hosts"

      - name: Verify operator branding is admin-gated (Phase 4)
        # White-label branding (/api/orgs/[id]/branding) lets an ADMIN READ and
