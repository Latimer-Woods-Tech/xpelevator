      - name: Verify tenant isolation on session reads (Phase 2 2/3)
        # Race-free proof: this runs in the SAME job right after the deploy above,
        # so the freshly-built code is guaranteed live on the pages.dev alias (no
        # "health 200 on the old build" ambiguity). Mints two authed identities in
        # different orgs, seeds an owner-held session, and asserts anon=401,
        # cross-tenant=403 (JSON + phone-stream), owner=200, then cleans up.
        env:
          BASE_URL: https://${{ env.CF_PROJECT }}.pages.dev
        run: node scripts/phase2-isolation-check.mjs

      - name: Verify /api/orgs cross-org governance isolation (R-043)
        # Race-free proof (same job, post-promotion): seeds a TENANT admin in
        # org A and an unrelated org B, then asserts the platform-super-admin vs
        # tenant-admin split holds on the freshly-promoted build — anon list=401,
        # tenant list excludes org B, cross-tenant GET/PUT/[id]=403 with org B's
        # plan unchanged, top-level POST=403, own-org GET=200. Closes the IDOR
        # where /api/orgs/* gated on the ADMIN role alone (any tenant admin could
        # read another tenant's roster, re-plan, or delete their org). Seeds and
        # cleans up its own throwaway orgs/user.
        env:
          BASE_URL: https://${{ env.CF_PROJECT }}.pages.dev
        run: node scripts/verify-orgs-isolation.mjs

      - name: Verify job-criteria cross-org read isolation
        # Race-free proof (same job, post-promotion): seeds two orgs each with a
        # job title + linked criterion and a TENANT MEMBER in org A, then asserts
        # GET /api/jobs/[id]/criteria is tenant-scoped on the freshly-promoted
        # build — anon=401, cross-tenant read=403 (org B's rubric NOT leaked),
        # unknown job=404, own-org read=200 (linked criterion still returned).
        # Closes the read-IDOR where the GET gated on auth alone with no org scope
        # (the sibling of the R-043 /api/orgs class). Seeds and cleans up its own
        # throwaway orgs/user/rubric.
        env:
          BASE_URL: https://${{ env.CF_PROJECT }}.pages.dev
        run: node scripts/verify-jobs-criteria-isolation.mjs

      - name: Verify job-title ↔ scenario cross-org isolation
        # Race-free proof (same job, post-promotion): seeds two orgs, a MEMBER +
        # ADMIN in org A, a GLOBAL job title carrying an org-A and an org-B
        # scenario, and a private job title in each org, then asserts on the
        # freshly-promoted build:
        #   READ  GET /api/jobs — anon=401; member A sees the shared job with its
        #         OWN scenario but NOT org B's (the read-IDOR fix), and never sees
        #         org B's private job title.
        #   WRITE POST /api/scenarios — attaching to org B's private job=403,
        #         unknown job=404, own job=201 (authoring still works).
        # Closes the cross-tenant scenario read leak on /api/jobs (unfiltered
        # relation join) + the unguarded foreign-key write on POST /api/scenarios
        # — the job↔scenario sibling of the R-043 /api/orgs and job-criteria
        # classes. Seeds and cleans up its own throwaway data.
        env:
          BASE_URL: https://${{ env.CF_PROJECT }}.pages.dev
        run: node scripts/verify-jobs-scenarios-isolation.mjs

      - name: Verify scoring-criteria cross-tenant isolation
        # Runtime-path sibling of the /api/* isolation gates: proves the
        # end-of-session scoring selection (loadScoringCriteria) is tenant-scoped
        # on the LIVE Postgres. Seeds two tenants + a global criterion and a
        # link-less org-A job/session, then asserts the OLD unscoped fallback
        # WOULD have leaked org B's criterion into org A's session (seed is
        # exploitable), the FIXED fallback + linked queries return org A's + the
        # global criterion but EXCLUDE org B's (leak closed), and an ORG-LESS
        # session still keeps every criterion (the live scoring canary is
        # org-less and must not regress). DB-only (no HTTP/LLM) → deterministic.
        # The companion unit tests assert the deployed handler issues exactly
        # these scoped queries, so handler + gate cannot drift. Seeds and cleans
        # up its own throwaway data. DATABASE_URL comes from job-level env.
        run: node scripts/verify-scoring-criteria-isolation.mjs

      - name: Verify per-turn latency telemetry persists (R-066)
